# Include inside the existing server {} block. Wenku upstreams remain independent.
# Preserve the existing access log while adding sanitized API telemetry.
access_log /var/log/nginx/access.log;
access_log /var/log/niko-monitor/access.jsonl niko_monitor if=$niko_monitor_log;
location = /niko-monitor {
    if ($scheme = http) {
        return 308 https://$host/niko-monitor/$is_args$args;
    }
    return 308 /niko-monitor/;
}
location ^~ /niko-monitor/ {
    # Upgrade login entry pages only. HTTP sites still need tracker/collect.
    set $niko_monitor_entry "$scheme:$uri";
    if ($niko_monitor_entry ~ "^http:/niko-monitor/(index[.]html)?$") {
        return 308 https://$host$request_uri;
    }
    proxy_pass http://127.0.0.1:4182;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 75s;
    client_max_body_size 8k;
}
